<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <style>
        #drag { 
        position: absolute;
        left: 25%;
        bottom: 5%;
        font-size: 100px;
        }
    </style>

</head>
<body>
    <h1>TEST DRAG</h1>
    <p>drag & drop Picture to url bar</p>
    <div id='drag' draggable="true">
        <a href="javascript:prompt(1337);//">DRAG TO ADDRESS BAR</a>
    </div>

<script>


document.onreadystatechange = () => {
    if (document.readyState === 'complete') {
        var x = document.getElementById("drag");
 
            x.addEventListener("dragstart", function(ev){

        location='https://www.google.com/'
        });

    }
};
</script>
</body>
</html>
